name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    env:
      # 以下 Secrets 均为可选:未配置时回退 ad-hoc 签名、跳过公证
      P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
      P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
      # 公证方式一(优先):App Store Connect API Key
      API_KEY_ID: ${{ secrets.APPLE_API_KEY }}
      API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      # 公证方式二(后备):Apple ID + App 专用密码
      NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
      NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
      NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: 导入签名证书(如已配置)
        run: |
          if [ -z "$P12_BASE64" ]; then
            echo "未配置 DEVELOPER_ID_P12_BASE64,将使用 ad-hoc 签名"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p ci-password "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci-password "$KEYCHAIN"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k ci-password "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: 构建并打包
        run: ./scripts/package.sh

      - name: 公证并盖章(如已配置)
        run: |
          if [ -z "$P12_BASE64" ] || { [ -z "$API_KEY_P8" ] && [ -z "$NOTARY_APPLE_ID" ]; }; then
            echo "未配置公证凭据,跳过 notarization"
            exit 0
          fi
          ditto -c -k --keepParent dist/Burrow.app dist/Burrow-notarize.zip
          if [ -n "$API_KEY_P8" ]; then
            echo "使用 App Store Connect API Key 公证"
            printf '%s' "$API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            xcrun notarytool submit dist/Burrow-notarize.zip \
              --key "$RUNNER_TEMP/AuthKey.p8" \
              --key-id "$API_KEY_ID" \
              --issuer "$API_ISSUER" \
              --wait
            rm -f "$RUNNER_TEMP/AuthKey.p8"
          else
            echo "使用 Apple ID + App 专用密码公证"
            xcrun notarytool submit dist/Burrow-notarize.zip \
              --apple-id "$NOTARY_APPLE_ID" \
              --team-id "$NOTARY_TEAM_ID" \
              --password "$NOTARY_PASSWORD" \
              --wait
          fi
          xcrun stapler staple dist/Burrow.app
          rm dist/Burrow-notarize.zip

      - name: 压缩产物
        run: ditto -c -k --keepParent dist/Burrow.app dist/Burrow.zip

      - name: 发布 Release(tag 触发)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Burrow.zip
          generate_release_notes: true

      - name: 生成并提交 appcast(tag 触发)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          # 仅需 Sparkle EdDSA 私钥(scripts/setup_sparkle_keys.sh 导出);
          # appcast 提交用内置 GITHUB_TOKEN,无需外部 token —— 前提:本仓库已公开
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPARKLE_VERSION: "2.9.4"
        run: |
          set -euo pipefail
          if [ -z "${SPARKLE_ED_PRIVATE_KEY:-}" ]; then
            echo "未配置 SPARKLE_ED_PRIVATE_KEY,跳过 appcast 生成"
            exit 0
          fi
          TAG="${GITHUB_REF_NAME}"

          # 1. 下载 Sparkle 工具取 sign_update(SPM 二进制包不含 CLI 工具,需单独取发行版)
          curl -sL -o sparkle-tools.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir -p sparkle-tools && tar -xf sparkle-tools.tar.xz -C sparkle-tools

          # 2. 用 sign_update 对更新包做 EdDSA 签名(私钥经 stdin 不落盘),
          #    再按 App 实际版本手写单条 appcast —— 比 generate_appcast 更可控稳定
          PLIST=dist/Burrow.app/Contents/Info.plist
          SHORT=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")
          MINOS=$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$PLIST")
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/Burrow.zip"
          PUBDATE=$(date -u +"%a, %d %b %Y %H:%M:%S +0000")
          SIGLEN=$(printf '%s' "$SPARKLE_ED_PRIVATE_KEY" \
            | sparkle-tools/bin/sign_update --ed-key-file - dist/Burrow.zip \
            | grep -o 'sparkle:edSignature=.*')
          if [ -z "$SIGLEN" ]; then echo "!! sign_update 未产出签名" >&2; exit 1; fi

          cat > appcast.xml <<EOF
          <?xml version="1.0" standalone="yes"?>
          <rss xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" version="2.0">
              <channel>
                  <title>Burrow</title>
                  <item>
                      <title>${SHORT}</title>
                      <pubDate>${PUBDATE}</pubDate>
                      <sparkle:version>${BUILD}</sparkle:version>
                      <sparkle:shortVersionString>${SHORT}</sparkle:shortVersionString>
                      <sparkle:minimumSystemVersion>${MINOS}</sparkle:minimumSystemVersion>
                      <enclosure url="${URL}" ${SIGLEN} type="application/octet-stream"/>
                  </item>
              </channel>
          </rss>
          EOF
          echo "==> appcast.xml:"; cat appcast.xml

          # 3. 把 appcast.xml 提交到本仓库 main(App 通过 raw 读取);[skip ci] 避免触发新构建
          git clone --branch main \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" appcast-repo
          cp appcast.xml appcast-repo/appcast.xml
          cd appcast-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "chore: appcast $TAG [skip ci]" || echo "appcast 无变化,跳过提交"
          git push origin main

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Burrow-${{ github.sha }}
          path: dist/Burrow.zip
